# Local development infrastructure. Start with `pnpm infra:up` from the repo root.
name: safezone

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: safezone
      POSTGRES_PASSWORD: safezone
      POSTGRES_DB: safezone
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safezone']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches outgoing email locally (Zoho SMTP is used in staging/production). UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  # S3-compatible object storage for uploads. Console: http://localhost:9001 (minio / minio-password)
  # S3-compatible storage. MinIO community images can no longer be pulled, so this uses RustFS (the
  # same image the integration tests use). Credentials match .env.example.
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio-password
    ports:
      - '9000:9000'
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  redis-data:
  storage-data:
