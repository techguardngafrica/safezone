name: Pull Request CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @safezone/backend-api prisma:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint affected workspaces
        run: pnpm turbo lint --filter=...[origin/main]

      - name: Typecheck affected workspaces
        run: pnpm turbo typecheck --filter=...[origin/main]

      - name: Test affected workspaces
        run: pnpm turbo test --filter=...[origin/main]

      - name: Build affected workspaces
        run: pnpm turbo build --filter=...[origin/main]

